# app/config/llm/model_registry.yaml
# ---------------------------------------------------------------------------
# LLM Model Registry — Part 9.2 (Azure-first, azure_openai_v1 endpoint mode)
# ---------------------------------------------------------------------------
# IMPORTANT: This file contains NO secrets.
# Provider profiles contain only environment variable NAMES (never actual values).
# Model aliases are capability-readable (e.g. math_basic_generator) — they are
# NOT coupled to a specific provider or model name.
#
# Provider strategy:
#   Primary aliases → Azure OpenAI first (GPT/OpenAI-family models).
#                     Uses azure_foundry_v1 profile (OpenAI-compatible /openai/v1 base URL).
#   Fallback aliases → Native OpenAI (suffixed _openai_native).
#   Other providers can be added as additional fallback aliases later.
#
# Azure API mode (azure_foundry_v1 profile):
#   AZURE_OPENAI_ENDPOINT must end with /openai/v1
#   (e.g. https://<resource>.openai.azure.com/openai/v1).
#   The deployment field is passed as model= — no /openai/deployments/... path.
#
# Fallback aliases (e.g. math_basic_generator_openai_native) are referenced
# only in fallback_models — never in llm_routes.yaml.
# ---------------------------------------------------------------------------

version: 1

models:

  # -------------------------------------------------------------------------
  # Azure base-model aliases — deployment from AZURE_OPENAI_DEPLOYMENT_* env vars
  # Optional GPT-5.x aliases remain inactive until env is set (blank deployment OK).
  # -------------------------------------------------------------------------

  openai_gpt_4_1:
    description: >-
      Azure GPT-4.1 full deployment. Deployment from AZURE_OPENAI_DEPLOYMENT_GPT_4_1
      (default gpt-4.1). Use for strong classifier or advanced generators when provisioned.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-4.1
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 30

  openai_gpt_5_6_luna:
    description: >-
      Azure GPT-5.6 Luna. Deployment from AZURE_OPENAI_DEPLOYMENT_5.6_LUNA
      (gpt-5.6-luna). Reasoning-capable with native Structured Outputs; effort is
      supplied per route through provider_options so it reaches the payload.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-5.6-luna
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: true
    reasoning_effort: high
    supported_reasoning_efforts: [low, medium, high, xhigh]
    token_budget_param: max_completion_tokens
    model_hard_max_output_tokens: 8000
    timeout_seconds: 60

  openai_gpt_5_6_terra:
    description: >-
      Azure GPT-5.6 Terra. Deployment from AZURE_OPENAI_DEPLOYMENT_5.6_TERRA
      (gpt-5.6-terra). Wired for the later Advanced qualification; not yet routed.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-5.6-terra
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: true
    reasoning_effort: high
    token_budget_param: max_completion_tokens
    model_hard_max_output_tokens: 8000
    timeout_seconds: 60

  openai_gpt_5_mini:
    description: >-
      Azure GPT-5 Mini. Deployment from AZURE_OPENAI_DEPLOYMENT_5_MINI
      (gpt-5-mini). Registered for resolution only; not placed on any route.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-5-mini
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: true
    reasoning_effort: medium
    token_budget_param: max_completion_tokens
    supports_temperature: false
    timeout_seconds: 30

  openai_gpt_4_1_mini:
    description: >-
      Azure GPT-4.1-mini deployment. From AZURE_OPENAI_DEPLOYMENT_GPT_4_1_MINI
      (default gpt-4.1-mini). Safe default for primary classifier.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 25

  openai_gpt_5_4:
    description: >-
      Optional Azure GPT-5.4 deployment. Active only when AZURE_OPENAI_DEPLOYMENT_GPT_5_4
      is set to a provisioned deployment name.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-5.4
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 30

  openai_gpt_5_4_mini:
    description: >-
      Optional Azure GPT-5.4-mini deployment. Active only when
      AZURE_OPENAI_DEPLOYMENT_GPT_5_4_MINI is set. Reasoning model: the deployment
      rejects max_tokens outright and reports reasoning tokens for every effort from
      low through xhigh. Unlike gpt-5-mini it does accept temperature, so that stays
      enabled rather than being copied from the sibling alias.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-5.4-mini
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: true
    reasoning_effort: medium
    supported_reasoning_efforts: [low, medium, high, xhigh]
    token_budget_param: max_completion_tokens
    supports_temperature: true
    model_hard_max_output_tokens: 8000
    timeout_seconds: 25

  openai_gpt_5_5:
    description: >-
      Optional Azure GPT-5.5 deployment. Active only when AZURE_OPENAI_DEPLOYMENT_GPT_5_5
      is set.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-5.5
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: false
    reasoning_effort: none
    timeout_seconds: 30

  openai_o4_mini:
    description: >-
      Azure o4-mini — balanced reasoning model. Deployment from
      AZURE_OPENAI_DEPLOYMENT_O4_MINI (default o4-mini).
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: o4-mini
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: true
    token_budget_param: max_completion_tokens
    supports_temperature: false
    reasoning_effort: medium
    timeout_seconds: 45

  openai_o3:
    description: >-
      Azure o3 — premium complex reasoning (CAT/SBI PO). Deployment from
      AZURE_OPENAI_DEPLOYMENT_O3 (default o3).
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: o3
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: true
    token_budget_param: max_completion_tokens
    supports_temperature: false
    reasoning_effort: high
    timeout_seconds: 60

  deepseek_v4pro:
    description: >-
      DeepSeek v4pro for hardest advanced math/reasoning. Model from
      DEEPSEEK_V4PRO_MODEL (default deepseek-reasoner). Optional — falls back to o3.
    provider: deepseek
    provider_profile: deepseek_primary
    model_id: deepseek-reasoner
    supports_streaming: true
    supports_thinking: true
    supports_reasoning: true
    reasoning_effort: high
    timeout_seconds: 90
    fallback_models:
      - openai_gpt_5_4

  # -------------------------------------------------------------------------
  # Primary aliases — benchmark-tuned (accuracy > cost > speed)
  # -------------------------------------------------------------------------

  math_basic_generator:
    description: >-
      Basic math generator — GPT-4.1-mini primary (token-efficient quant benchmark).
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: false
    reasoning_effort: none
    timeout_seconds: 30
    fallback_models:
      - openai_o4_mini
      - math_basic_generator_openai_native

  math_intermediate_generator:
    description: >-
      Intermediate math — GPT-4.1-mini primary; o4-mini then o3 fallback.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: false
    reasoning_effort: none
    timeout_seconds: 30
    fallback_models:
      - openai_o4_mini
      - openai_o3

  math_advanced_generator:
    description: >-
      Advanced math — DeepSeek v4pro primary; o3 fallback.
    provider: deepseek
    provider_profile: deepseek_primary
    model_id: deepseek-reasoner
    supports_streaming: true
    supports_thinking: true
    supports_reasoning: true
    reasoning_effort: high
    timeout_seconds: 90
    structured_output_reasoning_reserve_tokens: 2600
    fallback_models:
      - openai_o3

  math_cat_advanced_generator:
    description: >-
      CAT-level advanced math — o3 primary; DeepSeek v4pro and GPT-5.4 fallback.
      Inactive unless route selects math.generator.cat_advanced.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: o3
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: true
    reasoning_effort: high
    timeout_seconds: 60
    fallback_models:
      - deepseek_v4pro
      - openai_o3

  math_reasoning_generator:
    description: Azure-first reasoning model for advanced math and multi-step problems.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-4.1
    supports_streaming: true
    supports_thinking: true
    timeout_seconds: 40
    fallback_models:
      - math_reasoning_generator_openai_native

  reasoning_standard_generator:
    description: Azure-first standard reasoning generator. Falls back to native OpenAI.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-4.1
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 30
    fallback_models:
      - reasoning_standard_generator_openai_native

  reasoning_basic_generator:
    description: >-
      Basic reasoning — GPT-4.1-mini primary; o4-mini fallback.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: false
    reasoning_effort: none
    timeout_seconds: 30
    fallback_models:
      - openai_o4_mini
      - reasoning_basic_generator_openai_native

  reasoning_intermediate_generator:
    description: >-
      Intermediate reasoning — o4-mini primary (benchmark balanced model).
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: o4-mini
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: true
    reasoning_effort: medium
    timeout_seconds: 45
    fallback_models:
      - openai_gpt_4_1_mini
      - deepseek_v4pro

  reasoning_advanced_generator:
    description: >-
      Advanced reasoning — o4-mini primary; o3 and DeepSeek v4pro fallback.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: o4-mini
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: true
    reasoning_effort: medium
    timeout_seconds: 45
    fallback_models:
      - openai_o3
      - deepseek_v4pro

  reasoning_sbi_po_complex_generator:
    description: >-
      SBI PO complex reasoning — o3 primary. Inactive unless route selects
      reasoning.generator.sbi_po_complex.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: o3
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: true
    reasoning_effort: high
    timeout_seconds: 60
    fallback_models:
      - openai_o4_mini
      - deepseek_v4pro

  reasoning_cat_lrdi_generator:
    description: >-
      CAT LRDI complex reasoning — o3 primary. Inactive unless route selects
      reasoning.generator.cat_lrdi.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: o3
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: true
    reasoning_effort: high
    timeout_seconds: 60
    fallback_models:
      - deepseek_v4pro
      - openai_o4_mini

  # Deprecated — use reasoning_advanced_generator. Kept for backward-compatible registry lookups.
  reasoning_advanced_complex_generator:
    description: DEPRECATED — use reasoning_advanced_generator.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-4.1
    supports_streaming: true
    supports_thinking: true
    timeout_seconds: 45
    fallback_models:
      - reasoning_standard_generator

  english_fast_generator:
    description: Azure-first fast English explanation generator. Falls back to native OpenAI.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 30
    fallback_models:
      - english_fast_generator_openai_native

  general_fast_generator:
    description: >-
      General-purpose generator — GPT-4.1-mini primary; GPT-4.1 fallback for
      current-affairs depth when needed.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    deployment: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: false
    reasoning_effort: none
    timeout_seconds: 30
    fallback_models:
      - openai_gpt_4_1
      - general_fast_generator_openai_native

  # -------------------------------------------------------------------------
  # Fallback aliases — native OpenAI
  # These are NOT referenced in llm_routes.yaml.
  # They exist only as fallback_models targets.
  # -------------------------------------------------------------------------

  math_basic_generator_openai_native:
    description: Native OpenAI fallback for basic math generator.
    provider: openai
    provider_profile: openai_primary
    model_id: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 20

  math_reasoning_generator_openai_native:
    description: Native OpenAI fallback for reasoning model (thinking not supported natively).
    provider: openai
    provider_profile: openai_primary
    model_id: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 30

  math_intermediate_generator_openai_native:
    description: Native OpenAI fallback for intermediate math generator.
    provider: openai
    provider_profile: openai_primary
    model_id: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 30

  math_advanced_generator_openai_native:
    description: Native OpenAI fallback for advanced math generator.
    provider: openai
    provider_profile: openai_primary
    model_id: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 30

  reasoning_standard_generator_openai_native:
    description: Native OpenAI fallback for standard reasoning generator.
    provider: openai
    provider_profile: openai_primary
    model_id: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 20

  reasoning_basic_generator_openai_native:
    description: Native OpenAI fallback for basic reasoning generator.
    provider: openai
    provider_profile: openai_primary
    model_id: gpt-4o-mini
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 20

  reasoning_intermediate_generator_openai_native:
    description: Native OpenAI fallback for intermediate reasoning generator.
    provider: openai
    provider_profile: openai_primary
    model_id: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 25

  reasoning_advanced_generator_deepseek:
    description: >-
      Optional DeepSeek reasoning target for controlled route testing.
      Requires DEEPSEEK_API_KEY. Not referenced in active llm_routes by default.
    provider: deepseek
    provider_profile: deepseek_primary
    model_id: deepseek-reasoner
    supports_streaming: true
    supports_thinking: true
    timeout_seconds: 90

  # Deprecated — use deepseek_reasoning_generator or reasoning_advanced_generator_deepseek.
  reasoning_advanced_complex_generator_deepseek:
    description: DEPRECATED — use deepseek_reasoning_generator.
    provider: deepseek
    provider_profile: deepseek_primary
    model_id: deepseek-reasoner
    supports_streaming: true
    supports_thinking: true
    timeout_seconds: 90

  # -------------------------------------------------------------------------
  # Gemini aliases — optional, for controlled route testing / future image extraction
  # Not referenced in active production routes unless explicitly configured.
  # -------------------------------------------------------------------------

  gemini_flash_lite_text:
    description: >-
      Gemini flash-lite text generator. Optional provider — set GEMINI_API_KEY
      and point a route model alias here for controlled testing.
    provider: gemini
    provider_profile: gemini_primary
    model_id: gemini-2.5-flash-lite
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 30
    fallback_models:
      - general_fast_generator

  gemini_flash_text:
    description: >-
      Gemini flash text generator. Optional provider for controlled route testing.
    provider: gemini
    provider_profile: gemini_primary
    model_id: gemini-2.5-flash
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 30
    fallback_models:
      - general_fast_generator

  gemini_image_extractor:
    description: >-
      Future image question extraction target (adapter-level multimodal only).
      supports_streaming=false. Not wired to graph routes yet.
    provider: gemini
    provider_profile: gemini_primary
    model_id: gemini-2.5-flash-lite
    supports_streaming: false
    supports_thinking: false
    timeout_seconds: 30

  # -------------------------------------------------------------------------
  # DeepSeek aliases — optional, for advanced reasoning/math route testing
  # -------------------------------------------------------------------------

  deepseek_standard_generator:
    description: >-
      DeepSeek chat model for optional controlled route testing.
      Requires DEEPSEEK_API_KEY.
    provider: deepseek
    provider_profile: deepseek_primary
    model_id: deepseek-chat
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 60
    fallback_models:
      - reasoning_standard_generator

  deepseek_reasoning_generator:
    description: >-
      DeepSeek reasoner for advanced reasoning/math when explicitly configured.
    provider: deepseek
    provider_profile: deepseek_primary
    model_id: deepseek-reasoner
    supports_streaming: true
    supports_thinking: true
    timeout_seconds: 90
    fallback_models:
      - reasoning_standard_generator

  deepseek_advanced_generator:
    description: >-
      DeepSeek advanced reasoning alias (same model as reasoner until a distinct
      advanced model is provisioned). Not active unless a route points here.
    provider: deepseek
    provider_profile: deepseek_primary
    model_id: deepseek-reasoner
    supports_streaming: true
    supports_thinking: true
    timeout_seconds: 90
    fallback_models:
      - deepseek_reasoning_generator

  # -------------------------------------------------------------------------
  # Azure-hosted DeepSeek aliases — optional, inactive unless route-selected
  # Deployment names come from AZURE_DEEPSEEK_*_DEPLOYMENT env vars (not model_id).
  # -------------------------------------------------------------------------

  deepseek_azure_reasoning_generator:
    description: >-
      Azure-hosted DeepSeek reasoning model for advanced math/reasoning testing.
      Requires AZURE_DEEPSEEK_* credentials and AZURE_DEEPSEEK_REASONER_DEPLOYMENT.
    provider: azure_openai
    provider_profile: azure_deepseek
    deployment: ""
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: false
    reasoning_effort: none
    timeout_seconds: 90
    fallback_models:
      - reasoning_advanced_generator

  deepseek_azure_standard_generator:
    description: >-
      Azure-hosted DeepSeek standard/chat model for controlled testing.
      Requires AZURE_DEEPSEEK_* credentials and AZURE_DEEPSEEK_CHAT_DEPLOYMENT.
    provider: azure_openai
    provider_profile: azure_deepseek
    deployment: ""
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: false
    reasoning_effort: none
    timeout_seconds: 60
    fallback_models:
      - general_fast_generator

  deepseek_azure_advanced_generator:
    description: >-
      Azure-hosted DeepSeek advanced alias; inactive until route selects it.
      Requires AZURE_DEEPSEEK_* credentials and AZURE_DEEPSEEK_ADVANCED_DEPLOYMENT.
    provider: azure_openai
    provider_profile: azure_deepseek
    deployment: ""
    supports_streaming: true
    supports_thinking: false
    supports_reasoning: false
    reasoning_effort: none
    timeout_seconds: 90
    fallback_models:
      - deepseek_azure_reasoning_generator

  english_fast_generator_openai_native:
    description: Native OpenAI fallback for fast English explanation generator.
    provider: openai
    provider_profile: openai_primary
    model_id: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 20

  general_fast_generator_openai_native:
    description: Native OpenAI fallback for general-purpose generator.
    provider: openai
    provider_profile: openai_primary
    model_id: gpt-4.1-mini
    supports_streaming: true
    supports_thinking: false
    timeout_seconds: 20

  # -------------------------------------------------------------------------
  # Classifier models — Gemini primary, Azure GPT-4.1 strong fallback
  # -------------------------------------------------------------------------

  doubt_solver_classifier:
    description: >-
      Azure GPT-4.1-mini classifier retained only as a configuration rollback target.
      No active classifier route references this alias.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    allowed_task_roles: [classifier, follow_up_resolver]
    deployment: gpt-4.1-mini
    supports_streaming: false
    supports_thinking: false
    timeout_seconds: 20

  gemini_3_7_flash:
    description: >-
      Qualified Practice Answer Authority for Math and Reasoning, and the qualified
      Author for the factual family, on the existing Gemini provider and credential
      path. Capability metadata stays at the conservative defaults, with one probed
      exception: structured_output_reasoning_reserve_tokens records measured hidden
      reasoning consumption. No effort level is declared from documentation alone.
    provider: gemini
    provider_profile: gemini_primary
    allowed_task_roles: [generator, verifier]
    model_id: gemini-3.7-flash
    supports_streaming: false
    supports_thinking: false
    supports_reasoning: false
    reasoning_effort: none
    model_hard_max_output_tokens: 8000
    timeout_seconds: 60
    # Measured over 695 production-path calls: this model spends hidden reasoning against
    # the completion budget on essentially every call (p50 156, p95 565, p99 1042, max
    # 1441) while visible output stays at 149-344. Every other alias measures 0. This
    # records observed consumption so batching stops treating the whole budget as usable;
    # it does not enable a reasoning feature. 1500 covers the full observed sample.
    structured_output_reasoning_reserve_tokens: 1500

  doubt_solver_classifier_gemini:
    description: Native Gemini 3.1 Flash-Lite primary classifier.
    provider: gemini
    provider_profile: gemini_primary
    allowed_task_roles: [classifier]
    model_id: gemini-3.1-flash-lite
    supports_streaming: false
    supports_thinking: false
    timeout_seconds: 20

  doubt_solver_classifier_openai_native:
    description: Native OpenAI fallback for doubt solver classifier.
    provider: openai
    provider_profile: openai_primary
    allowed_task_roles: [classifier, classifier_strong, follow_up_resolver]
    model_id: gpt-4.1-mini
    supports_streaming: false
    supports_thinking: false
    timeout_seconds: 15

  doubt_solver_classifier_strong:
    description: >-
      Sole strong classifier fallback: Azure GPT-4.1.
    provider: azure_openai
    provider_profile: azure_foundry_v1
    allowed_task_roles: [classifier_strong]
    deployment: gpt-4.1
    supports_streaming: false
    supports_thinking: false
    timeout_seconds: 25

  # -------------------------------------------------------------------------
  # Request Intelligence — small, fast, schema-constrained interpretation model
  # -------------------------------------------------------------------------

  practice_request_intelligence:
    description: >-
      GLM 4.7 Flash on Amazon Bedrock (in-region, on-demand) used only to interpret
      a free-text Practice request into explicit constraints. No fallback alias:
      when it is unavailable Practice falls back to the existing deterministic
      request resolution rather than paying a second model.
    provider: bedrock
    provider_profile: bedrock_apsouth1
    allowed_task_roles: [request_intelligence]
    model_id: zai.glm-4.7-flash
    supports_streaming: false
    supports_thinking: false
    supports_reasoning: false
    reasoning_effort: none
    timeout_seconds: 20

  practice_request_intelligence_gemma:
    description: >-
      Gemma 3 12B IT on Amazon Bedrock (in-region, on-demand). Candidate for the
      Request Intelligence role. Inactive until a route selects it — swapping the
      interpretation model is a registry/route change only, never a code change.
    provider: bedrock
    provider_profile: bedrock_apsouth1
    allowed_task_roles: [request_intelligence]
    model_id: google.gemma-3-12b-it
    supports_streaming: false
    supports_thinking: false
    supports_reasoning: false
    reasoning_effort: none
    timeout_seconds: 20

