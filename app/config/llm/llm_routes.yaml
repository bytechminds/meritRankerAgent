# app/config/llm/llm_routes.yaml
# ---------------------------------------------------------------------------
# LLM Routing Table — Part 7.1 (split from llm_orchestration.yaml)
# ---------------------------------------------------------------------------
# IMPORTANT: This file contains NO secrets and NO provider details.
# Routes reference model ALIASES only (capability-readable names like
# "math_basic_generator").  Provider details live in model_registry.yaml.
#
# max_tokens is the hard generator output token budget (max_output_tokens).
# ---------------------------------------------------------------------------

version: 1

routes:
  # -------------------------------------------------------------------------
  # Generator routes
  # -------------------------------------------------------------------------
  math:
    verifier:
      default:
        # Practice Answer Authority for Math. Gemini 3.7 Flash was the only
        # candidate with 0 critical false accepts across three runs of the frozen
        # 101-item hand-verified gold corpus (49 Math, 52 Reasoning). No reasoning
        # effort is sent — this model declares none, and none is inferred.
        model: gemini_3_7_flash
        prompt: practice_generation/question_verifier_v2.md
        temperature: 0.0
        max_tokens: 5000
        fallback: []

    generator:
      default:
        model: math_basic_generator
        prompt: subjects/math_generator.md
        temperature: 0.2
        max_tokens: 900
        intent_overlays:
          solve:
            - intents/solve.md
          explain:
            - intents/explain.md
          practice:
            - intents/practice.md
          visualize:
            - intents/visualize.md
        fallback:
          - general_default
          - safe_mock

      basic:
        inherits: default
        overlays:
          - levels/basic.md
        max_tokens: 900
        fallback:
          - default
          - general_default
          - safe_mock

      intermediate:
        inherits: default
        model: math_intermediate_generator
        overlays:
          - levels/intermediate.md
        max_tokens: 2600
        fallback:
          - basic
          - default
          - general_default
          - safe_mock

      advanced:
        inherits: default
        model: openai_gpt_4_1
        overlays:
          - levels/advanced.md
        temperature: 0.15
        max_tokens: 3600
        fallback:
          - intermediate
          - default
          - general_default
          - safe_mock

      # DORMANT — unreachable (normalize_difficulty never yields this key) and still
      # resolves to retired o3. Kept for history only; do not select.
      cat_advanced:
        inherits: default
        model: math_cat_advanced_generator
        overlays:
          - levels/advanced.md
        temperature: 0.15
        max_tokens: 2600
        fallback:
          - advanced
          - default
          - general_default
          - safe_mock

      # Optional DeepSeek test route — inactive unless explicitly selected.
      deepseek_test:
        model: deepseek_reasoning_generator
        prompt: subjects/math_generator.md
        temperature: 0.15
        max_tokens: 2600
        fallback:
          - advanced
          - default
          - general_default
          - safe_mock

      # Optional Azure-hosted DeepSeek test route — inactive unless selected.
      deepseek_azure_test:
        model: deepseek_azure_reasoning_generator
        prompt: subjects/math_generator.md
        temperature: 0.15
        max_tokens: 2600
        fallback:
          - advanced
          - default
          - general_default
          - safe_mock

  # Route-only Practice Math authoring distinction. `planning.py` is the sole
  # producer and selects it only for default/intermediate Math slots; this keeps
  # the shared Math routes used by Doubt Solver, basic Practice, and advanced
  # Practice unchanged.
  practice_math:
    generator:
      default:
        model: openai_gpt_5_6_terra
        prompt: subjects/math_generator.md
        temperature: 0.2
        max_tokens: 900
        intent_overlays:
          practice:
            - intents/practice.md
        fallback:
          - general_default
          - safe_mock

      intermediate:
        inherits: default
        overlays:
          - levels/intermediate.md
        max_tokens: 2600
        fallback:
          - default
          - general_default
          - safe_mock

  reasoning:
    verifier:
      default:
        # Practice Answer Authority for Reasoning. Gemini 3.7 Flash was the only
        # candidate with 0 critical false accepts across three runs of the frozen
        # 101-item hand-verified gold corpus (49 Math, 52 Reasoning). No reasoning
        # effort is sent — this model declares none, and none is inferred.
        model: gemini_3_7_flash
        prompt: practice_generation/question_verifier_v2.md
        temperature: 0.0
        max_tokens: 5000
        fallback: []

    generator:
      default:
        model: reasoning_basic_generator
        prompt: subjects/reasoning_generator.md
        temperature: 0.2
        max_tokens: 1000
        intent_overlays:
          solve:
            - intents/solve.md
          explain:
            - intents/explain.md
          practice:
            - intents/practice.md
          visualize:
            - intents/visualize.md
        fallback:
          - general_default
          - safe_mock

      basic:
        inherits: default
        # Basic Reasoning Author. Confirmed under the qualified Gemini Authority:
        # 24/24 structural, 23/24 first-pass accepted, the single defect caught by
        # the gate. Distinct from the Authority model, preserving independence.
        model: openai_gpt_5_4_mini
        overlays:
          - levels/basic.md
        max_tokens: 1000
        fallback:
          - default
          - general_default
          - safe_mock

      intermediate:
        inherits: default
        # Retired o4-mini replaced by Terra (fallback Azure DeepSeek-V4-Pro).
        model: openai_gpt_5_6_terra
        overlays:
          - levels/intermediate.md
        max_tokens: 1800
        provider_options:
          reasoning_effort: medium
        fallback:
          - basic
          - default
          - general_default
          - safe_mock

      advanced:
        inherits: default
        # Retired o4-mini/o3 replaced by Terra (fallback Azure DeepSeek-V4-Pro).
        model: openai_gpt_5_6_terra
        overlays:
          - levels/advanced.md
        max_tokens: 3200
        provider_options:
          reasoning_effort: medium
          thinking: true
        fallback:
          - intermediate
          - default
          - general_default
          - safe_mock

      # DORMANT — unreachable (normalize_difficulty never yields this key) and still
      # resolves to retired o3. Kept for history only; do not select.
      sbi_po_complex:
        inherits: default
        model: reasoning_sbi_po_complex_generator
        overlays:
          - levels/advanced.md
        max_tokens: 3200
        provider_options:
          thinking: true
        fallback:
          - advanced
          - default
          - general_default
          - safe_mock

      # DORMANT — unreachable (normalize_difficulty never yields this key) and still
      # resolves to retired o3. Kept for history only; do not select.
      cat_lrdi:
        inherits: default
        model: reasoning_cat_lrdi_generator
        overlays:
          - levels/advanced.md
        max_tokens: 3200
        provider_options:
          thinking: true
        fallback:
          - advanced
          - default
          - general_default
          - safe_mock

      # Optional DeepSeek test route — inactive unless explicitly selected.
      deepseek_test:
        model: deepseek_reasoning_generator
        prompt: subjects/reasoning_generator.md
        temperature: 0.15
        max_tokens: 2600
        fallback:
          - advanced
          - default
          - general_default
          - safe_mock

      # Optional Azure-hosted DeepSeek test route — inactive unless selected.
      deepseek_azure_test:
        model: deepseek_azure_reasoning_generator
        prompt: subjects/reasoning_generator.md
        temperature: 0.15
        max_tokens: 2600
        fallback:
          - advanced
          - default
          - general_default
          - safe_mock

  english:
    # Gemini 3.7 is the qualified English Answer Authority for rule-bound items.
    # Author and Authority must stay different models, so the English Author is
    # sourced from a non-Gemini alias.
    verifier:
      default:
        model: gemini_3_7_flash
        prompt: practice_generation/question_verifier_v2.md
        temperature: 0.0
        max_tokens: 5000
        fallback: []

    planner:
      default:
        model: general_fast_generator
        prompt: practice_generation/planners/english.md
        temperature: 0.1
        max_tokens: 1400
        fallback:
          - safe_mock
      basic:
        inherits: default
        max_tokens: 1200
        fallback:
          - default
          - safe_mock
      intermediate:
        inherits: default
        model: openai_gpt_4_1
        max_tokens: 8000
        fallback:
          - default
          - safe_mock
      advanced:
        inherits: default
        model: openai_gpt_4_1
        max_tokens: 8000
        fallback:
          - intermediate
          - default
          - safe_mock

    generator:
      default:
        model: openai_gpt_5_4_mini
        prompt: subjects/english_generator.md
        temperature: 0.3
        max_tokens: 1000
        intent_overlays:
          solve:
            - intents/solve.md
          explain:
            - intents/explain.md
          practice:
            - intents/practice.md
          visualize:
            - intents/visualize.md
        fallback:
          - general_default
          - safe_mock

      basic:
        inherits: default
        overlays:
          - levels/basic.md
        max_tokens: 1000
        fallback:
          - default
          - general_default
          - safe_mock

      intermediate:
        inherits: default
        overlays:
          - levels/intermediate.md
        max_tokens: 1000
        fallback:
          - basic
          - default
          - general_default
          - safe_mock

      advanced:
        inherits: default
        overlays:
          - levels/advanced.md
        max_tokens: 1000
        fallback:
          - intermediate
          - default
          - general_default
          - safe_mock

  quant_reasoning:
    planner:
      default:
        model: general_fast_generator
        prompt: practice_generation/planners/quant_reasoning.md
        temperature: 0.1
        max_tokens: 1400
        fallback:
          - safe_mock
      basic:
        inherits: default
        max_tokens: 1200
        fallback:
          - default
          - safe_mock
      intermediate:
        inherits: default
        model: openai_gpt_4_1
        max_tokens: 8000
        fallback:
          - default
          - safe_mock
      advanced:
        inherits: default
        model: openai_gpt_4_1
        max_tokens: 8000
        fallback:
          - intermediate
          - default
          - safe_mock

  factual:
    # Qualified production routes for the factual family: Gemini 3.7 authors, GPT-5.6
    # Luna is the blind Answer Authority. Author and Authority are deliberately
    # different models so agreement is independent evidence, not one model agreeing
    # with itself.
    verifier:
      default:
        model: openai_gpt_5_6_luna
        prompt: practice_generation/question_verifier_v2.md
        temperature: 0.0
        max_tokens: 5000
        fallback: []

    generator:
      default:
        model: gemini_3_7_flash
        prompt: subjects/general_generator.md
        temperature: 0.3
        # 1500 reasoning reserve + 120 envelope + 840 visible, the smallest cap that keeps
        # the batch sizes this route already produced (3 low / 2 medium / 2 high). At the
        # previous 1000 the reserve was unrecorded, so batches were sized from visible
        # output alone and over-packed into output_token_exhausted.
        max_tokens: 2460
        fallback:
          - safe_mock

    planner:
      default:
        model: general_fast_generator
        prompt: practice_generation/planners/factual.md
        temperature: 0.1
        max_tokens: 1400
        fallback:
          - safe_mock
      basic:
        inherits: default
        max_tokens: 1200
        fallback:
          - default
          - safe_mock
      intermediate:
        inherits: default
        model: openai_gpt_4_1
        max_tokens: 8000
        fallback:
          - default
          - safe_mock
      advanced:
        inherits: default
        model: openai_gpt_4_1
        max_tokens: 8000
        fallback:
          - intermediate
          - default
          - safe_mock

  general:
    planner:
      default:
        model: general_fast_generator
        prompt: practice_generation/blueprint_planner.md
        temperature: 0.1
        max_tokens: 1400
        fallback:
          - safe_mock

      basic:
        inherits: default
        max_tokens: 1200
        fallback:
          - default
          - safe_mock

      intermediate:
        inherits: default
        model: openai_gpt_4_1
        max_tokens: 8000
        fallback:
          - default
          - safe_mock

      advanced:
        inherits: default
        model: openai_gpt_4_1
        max_tokens: 8000
        fallback:
          - intermediate
          - default
          - safe_mock

    verifier:
      default:
        # Doubt Solver's answer-correctness verifier. Retired o4-mini replaced by
        # Terra (fallback Azure DeepSeek-V4-Pro via the alias's fallback_models).
        # Prompt, schema, guards, budget and reasoning effort are unchanged.
        model: openai_gpt_5_6_terra
        prompt: answer_correctness_verifier.md
        temperature: 0.0
        max_tokens: 5000
        provider_options:
          reasoning_effort: medium
        fallback: []

    follow_up_resolver:
      default:
        model: doubt_solver_classifier
        prompt: follow_up_query_resolver.md
        temperature: 0.0
        max_tokens: 220
        fallback: []

    request_intelligence:
      default:
        model: openai_gpt_5_6_terra
        prompt: practice_generation/request_intelligence.md
        temperature: 0.0
        max_tokens: 700
        fallback: []

    classifier:
      default:
        model: doubt_solver_classifier_gemini
        prompt: classification_semantics.md
        temperature: 0.1
        max_tokens: 650
        overlays:
          - query_classifier_text.md
        fallback:
          - safe_mock

    classifier_strong:
      default:
        model: doubt_solver_classifier_strong
        prompt: classification_semantics.md
        temperature: 0.0
        max_tokens: 800
        overlays:
          - query_classifier_text.md
          - query_classifier.md
        fallback:
          - safe_mock

    generator:
      default:
        model: general_fast_generator
        prompt: subjects/general_generator.md
        temperature: 0.3
        max_tokens: 900
        intent_overlays:
          solve:
            - intents/solve.md
          explain:
            - intents/explain.md
          practice:
            - intents/practice.md
          visualize:
            - intents/visualize.md
        fallback:
          - safe_mock

      intermediate:
        inherits: default
        overlays:
          - levels/intermediate.md
        max_tokens: 1400
        fallback:
          - default
          - safe_mock

      advanced:
        inherits: default
        overlays:
          - levels/advanced.md
        max_tokens: 2200
        fallback:
          - intermediate
          - default
          - safe_mock

      # Optional Gemini test route — inactive unless explicitly selected.
      gemini_test:
        model: gemini_flash_text
        prompt: subjects/general_generator.md
        temperature: 0.3
        max_tokens: 900
        fallback:
          - default
          - safe_mock

      # Optional Azure-hosted DeepSeek test route — inactive unless selected.
      deepseek_azure_test:
        model: deepseek_azure_standard_generator
        prompt: subjects/general_generator.md
        temperature: 0.3
        max_tokens: 900
        fallback:
          - default
          - safe_mock

  current_affairs:
    generator:
      default:
        model: general_fast_generator
        prompt: subjects/general_generator.md
        temperature: 0.25
        max_tokens: 1800
        intent_overlays:
          solve:
            - intents/solve.md
          explain:
            - intents/explain.md
          practice:
            - intents/practice.md
          visualize:
            - intents/visualize.md
        fallback:
          - general_default
          - safe_mock

  practice:
    generator:
      default:
        model: general_fast_generator
        prompt: subjects/general_generator.md
        temperature: 0.25
        max_tokens: 2600
        overlays:
          - intents/practice.md
        fallback:
          - general_default
          - safe_mock
