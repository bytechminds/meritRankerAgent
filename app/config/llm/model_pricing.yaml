# Manually reviewed, versioned pricing inputs for local cost estimates.
# Provider invoices remain authoritative. Add an entry only after the price for
# the exact provider/model or Azure deployment has been verified.

pricing_version: "2026-08-28-reviewed"
billing_version: "billing-v1"
metering_enabled: true
credit_debit_enabled: false
currency: USD
models:
  - provider: openai
    model_or_deployment: gpt-4.1-mini
    input_cost_per_million_tokens: 0.40
    output_cost_per_million_tokens: 1.60
    cached_input_cost_per_million_tokens: 0.10
    effective_from: "2026-07-27"
  - provider: openai
    model_or_deployment: gpt-4.1
    input_cost_per_million_tokens: 2.00
    output_cost_per_million_tokens: 8.00
    cached_input_cost_per_million_tokens: 0.50
    effective_from: "2026-07-27"
  # AWS published Bedrock on-demand pricing for GLM 4.7 Flash, Asia Pacific
  # (Mumbai) / ap-south-1. Reviewed 2026-08-28. Cached-input rate not published
  # for this model, so it is intentionally absent rather than assumed.
  - provider: bedrock
    model_or_deployment: zai.glm-4.7-flash
    input_cost_per_million_tokens: 0.08
    output_cost_per_million_tokens: 0.48
    effective_from: "2026-08-28"
  # AWS published Bedrock on-demand pricing for MiniMax M2.5, Asia Pacific
  # (Mumbai) / ap-south-1. Reviewed 2026-08-28. Cached-input rate not published
  # for this model, so it is intentionally absent rather than assumed.
  - provider: bedrock
    model_or_deployment: minimax.minimax-m2.5
    input_cost_per_million_tokens: 0.36
    output_cost_per_million_tokens: 1.44
    effective_from: "2026-08-28"
  # AWS published Bedrock on-demand (Standard tier) pricing for Qwen3 Next 80B A3B,
  # Asia Pacific (Mumbai) / ap-south-1. Reviewed 2026-08-29. Cached-input rate not
  # published for this model, so it is intentionally absent rather than assumed.
  - provider: bedrock
    model_or_deployment: qwen.qwen3-next-80b-a3b
    input_cost_per_million_tokens: 0.18
    output_cost_per_million_tokens: 1.41
    effective_from: "2026-08-29"
  - provider: gemini
    model_or_deployment: gemini-3.1-flash-lite
    input_cost_per_million_tokens: 0.25
    output_cost_per_million_tokens: 1.50
    cached_input_cost_per_million_tokens: 0.025
    effective_from: "2026-07-27"
  # Google Gemini Developer API, Standard (non-batch) paid tier, verified
  # 2026-09-11 against ai.google.dev/gemini-api/docs/pricing. The runtime issues
  # synchronous calls, so the Batch tier ($0.375/$1.875) does not apply.
  # WARNING: these are INTRODUCTORY rates that Google publishes as valid
  # "through December 31, 2026"; from 2027-01-01 the standard rates become
  # $1.50 / $7.50. _find_rate performs no date-based selection, so this row must
  # be updated on 2027-01-01 or every operation using it will be under-charged
  # by half. Cached-input pricing is not published for this model and is
  # therefore intentionally absent rather than assumed.
  - provider: gemini
    model_or_deployment: gemini-3.7-flash
    input_cost_per_million_tokens: 0.75
    output_cost_per_million_tokens: 3.75
    effective_from: "2026-09-11"
  # OpenAI public API, Standard (non-batch) tier, verified 2026-09-11 against
  # developers.openai.com/api/docs/pricing. Reached only as a provider-failure
  # fallback for reasoning_basic_generator.
  - provider: openai
    model_or_deployment: gpt-4o-mini
    input_cost_per_million_tokens: 0.15
    output_cost_per_million_tokens: 0.60
    cached_input_cost_per_million_tokens: 0.075
    effective_from: "2026-09-11"

  # ---------------------------------------------------------------------------
  # Azure OpenAI — South India deployments. Rates supplied by the project owner
  # from the authoritative Azure pricing sheet for this subscription and
  # validated manually on 2026-09-11. Azure rates are deployment-specific and are
  # NOT inferred from OpenAI public API pricing. Keyed on the deployment name,
  # which uniquely identifies the routed model.
  # Context-tier note: the runtime's worst-case context is ~14k tokens (query
  # <=5000 chars, doubt context <=6000, retrieval <=2500, web <=2500, prompt
  # <=8000 chars; output hard-capped at 8000 by the route schema). gpt-5.4
  # therefore always bills under its <272k tier and gpt-5.6-luna always bills at
  # its short-context tier.
  - provider: azure_openai
    model_or_deployment: gpt-4.1-mini
    input_cost_per_million_tokens: 0.40
    output_cost_per_million_tokens: 1.60
    cached_input_cost_per_million_tokens: 0.10
    effective_from: "2026-09-11"
  - provider: azure_openai
    model_or_deployment: gpt-4.1
    input_cost_per_million_tokens: 2.00
    output_cost_per_million_tokens: 8.00
    cached_input_cost_per_million_tokens: 0.50
    effective_from: "2026-09-11"
  - provider: azure_openai
    model_or_deployment: o4-mini
    input_cost_per_million_tokens: 1.10
    output_cost_per_million_tokens: 4.40
    cached_input_cost_per_million_tokens: 0.28
    effective_from: "2026-09-11"
  - provider: azure_openai
    model_or_deployment: o3
    input_cost_per_million_tokens: 2.00
    output_cost_per_million_tokens: 8.00
    cached_input_cost_per_million_tokens: 0.50
    effective_from: "2026-09-11"
  - provider: azure_openai
    model_or_deployment: gpt-5.4-mini
    input_cost_per_million_tokens: 0.75
    output_cost_per_million_tokens: 4.50
    cached_input_cost_per_million_tokens: 0.08
    effective_from: "2026-09-11"
  # Short-context tier (confirmed above).
  - provider: azure_openai
    model_or_deployment: gpt-5.6-luna
    input_cost_per_million_tokens: 0.20
    output_cost_per_million_tokens: 1.20
    cached_input_cost_per_million_tokens: 0.02
    effective_from: "2026-09-11"
  # <272k context tier (confirmed above).
  - provider: azure_openai
    model_or_deployment: gpt-5.4
    input_cost_per_million_tokens: 2.50
    output_cost_per_million_tokens: 15.00
    cached_input_cost_per_million_tokens: 0.25
    effective_from: "2026-09-11"
  # Azure Global Standard, South India resource, verified 2026-09-15. Deployment
  # proven pay-as-you-go at the default tier in South India (response headers
  # azureai-fe-offer-type=paygo, x-ms-region=South India, service_tier=default);
  # the runtime sends no service_tier, so Priority and Flex meters do not apply.
  # Rates are the southindia meters from prices.azure.com, matching the Microsoft
  # Foundry GPT-5.6 launch post. Short-context tier: long-context pricing
  # starts above 272K input tokens, beyond the runtime's worst-case context.
  # The $2.50 cache-write meter is not modelled; the runtime issues no explicit
  # cache writes. Reasoning tokens are part of output tokens, with no separate rate.
  - provider: azure_openai
    model_or_deployment: gpt-5.6-terra
    input_cost_per_million_tokens: 2.00
    output_cost_per_million_tokens: 12.00
    cached_input_cost_per_million_tokens: 0.20
    effective_from: "2026-09-15"
  # Azure DeepSeek Models (sold by Azure, not Fireworks), Global Standard, South
  # India resource, verified 2026-09-15. Deployment proven paygo at the default
  # tier in South India (azureai-processed-tier=default). The southindia
  # prices.azure.com meters "V4 Pro Inp/Outp/cached glbl" are $0.00174 /
  # $0.00348 / $0.000145 per 1K tokens. Data Zone meters are not offered in
  # southindia. No separate reasoning-token rate is published.
  - provider: azure_openai
    model_or_deployment: DeepSeek-V4-Pro
    input_cost_per_million_tokens: 1.74
    output_cost_per_million_tokens: 3.48
    cached_input_cost_per_million_tokens: 0.145
    effective_from: "2026-09-15"

