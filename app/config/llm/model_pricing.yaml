    model_or_deployment: zai.glm-4.7-flash
    input_cost_per_million_tokens: 0.08
    output_cost_per_million_tokens: 0.48
    effective_from: "2026-08-28"
  # AWS published Bedrock on-demand pricing for MiniMax M2.5, Asia Pacific
  # (Mumbai) / ap-south-1. Reviewed 2026-08-28. Cached-input rate not published
  # for this model, so it is intentionally absent rather than assumed.
  - provider: bedrock
    model_or_deployment: minimax.minimax-m2.5
    input_cost_per_million_tokens: 0.36
    output_cost_per_million_tokens: 1.44
    effective_from: "2026-08-28"
  # AWS published Bedrock on-demand (Standard tier) pricing for Qwen3 Next 80B A3B,
  # Asia Pacific (Mumbai) / ap-south-1. Reviewed 2026-08-29. Cached-input rate not
  # published for this model, so it is intentionally absent rather than assumed.
  - provider: bedrock
    model_or_deployment: qwen.qwen3-next-80b-a3b
    input_cost_per_million_tokens: 0.18
    output_cost_per_million_tokens: 1.41
    effective_from: "2026-08-29"
  - provider: gemini
    model_or_deployment: gemini-3.1-flash-lite
    input_cost_per_million_tokens: 0.25
    output_cost_per_million_tokens: 1.50
    cached_input_cost_per_million_tokens: 0.025
    effective_from: "2026-07-27"

