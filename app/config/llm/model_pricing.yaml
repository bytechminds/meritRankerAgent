# Manually reviewed, versioned pricing inputs for local cost estimates.
# Provider invoices remain authoritative. Add an entry only after the price for
# the exact provider/model or Azure deployment has been verified.

pricing_version: "2026-08-28-reviewed"
billing_version: "billing-v1"
metering_enabled: true
credit_debit_enabled: false
currency: USD
models:
