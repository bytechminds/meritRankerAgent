schemaVersion: 2
defaultCategory: STANDARD_OBJECTIVE

limits:
  maxCategoryGuideChars: 190
  maxAppendGuideChars: 90
  maxResolvedContextChars: 260

categories:
  BASIC_OBJECTIVE:
    guide: >-
      Answer directly in simple language with essential steps or facts.
      Add one useful fact or common mistake.
  STANDARD_OBJECTIVE:
    guide: >-
      Give a concise, complete explanation with an efficient method,
      useful rule, shortcut, or related fact.
  ANALYTICAL_OBJECTIVE:
    guide: >-
      Preserve every condition, explain the decisive logic, and use the fastest fully reliable method.
      Note one trap.
  CONCEPTUAL_OBJECTIVE:
    guide: >-
      Explain the core concept, key distinctions, and essential background.
      Add one useful fact or elimination clue.
  DESCRIPTIVE_ANALYTICAL:
    guide: >-
      Give conceptual depth and balanced analysis.
      Connect relevant dimensions, causes, effects, examples, and current relevance.
  PEDAGOGY_CONCEPTUAL:
    guide: >-
      Explain the principle clearly and connect it to practical teaching
      or classroom application when relevant.
  TECHNICAL_PROBLEM_SOLVING:
    guide: >-
      State the governing concept or formula and show verifiable working,
      including necessary assumptions and conditions.
  ADVANCED_APTITUDE:
    guide: >-
      Use compact analytical reasoning and the shortest reliable approach,
      focusing on constraints, interpretation, and elimination.

